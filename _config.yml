# Jupyter Book configuration for the BASTA lecture notes
title: Bayesian Statistics for Astrophysics
author: Sjoert van Velzen and the BASTA teaching team (Leiden Observatory)
copyright: "2024-2026"
logo: ""

# The notebooks are stored with their outputs; do not re-execute on every build.
# Set to "auto" or "force" to execute during the build instead.
execute:
  execute_notebooks: "off"
  timeout: 1800

only_build_toc_files: true
exclude_patterns: [_build, src, "**.ipynb_checkpoints", README.md, build_nb.sh]

parse:
  myst_enable_extensions:
    - amsmath
    - dollarmath
    - colon_fence
    - deflist
    - html_image
    - linkify
    - substitution
    - tasklist

html:
  use_repository_button: false
  use_issues_button: false
  use_edit_page_button: false
  home_page_in_navbar: true
  baseurl: ""

launch_buttons:
  notebook_interface: "classic"
  colab_url: ""
  binderhub_url: ""

sphinx:
  config:
    html_static_path: [_static]
    html_css_files: [custom.css]
    html_theme_options:
      repository_url: ""
      use_download_button: true
      use_fullscreen_button: true
      show_toc_level: 2
      navigation_with_keys: false
    mathjax3_config:
      tex:
        macros: {}
    nb_render_image_options:
      align: center
    html_show_copyright: false
